# G-2 2차 — 평가기·PolicyService 우회 의미 패턴 검출 (작업지시서 WP-3 항목 7)
# 1차(ESLint AST 셀렉터)가 못 잡는 "권한 데이터 직접 접근"을 잡는다. CI lint 잡에서 실행.
rules:
  - id: authz-bypass-resource-grants
    languages: [ts]
    severity: ERROR
    message: >-
      resource_grants 직접 접근 금지 (INV-1) — 평가는 AuthorizationService.can(),
      조회는 GrantStore, 생성/회수는 공유 서비스(Phase 2)를 경유해야 합니다.
    patterns:
      - pattern: $DB.resourceGrant.$METHOD(...)
    paths:
      exclude:
        # Grant 변경의 유일한 통로 — 정리·회수가 감사와 함께 이뤄진다
        - apps/api/src/authorization/resource-grant.service.ts
        - apps/api/src/authorization/grant.store.ts # 조회 전용(평가기 2·4단계)
        - apps/api/test/
        - db/seeds/

  - id: authz-bypass-user-roles
    languages: [ts]
    severity: ERROR
    message: >-
      user_roles 직접 변경 금지 — 역할 부여/회수는 우위·부분집합 검사(§4.6)와 감사 기록(INV-6)을
      한 트랜잭션으로 묶는 RoleGrantService 를 경유해야 합니다.
    # 조회는 허용하고 변경 메서드만 차단한다(조회까지 막으면 정상 코드가 걸려 룰 신뢰도가 떨어진다)
    pattern-either:
      - pattern: $DB.userRole.create(...)
      - pattern: $DB.userRole.createMany(...)
      - pattern: $DB.userRole.update(...)
      - pattern: $DB.userRole.updateMany(...)
      - pattern: $DB.userRole.upsert(...)
      - pattern: $DB.userRole.delete(...)
      - pattern: $DB.userRole.deleteMany(...)
    paths:
      exclude:
        - apps/api/src/authorization/role-grant.service.ts
        - apps/api/test/
        - db/seeds/

  - id: authz-bypass-role-permissions
    languages: [ts]
    severity: ERROR
    message: >-
      role_permissions 직접 변경 금지 — 매핑 편집은 "보유하지 않은 Permission 부여 불가"(§10.1)와
      보유자 pv 무효화(§8.3)를 함께 수행하는 RolesService.setPermissions 를 경유해야 합니다.
    pattern-either:
      - pattern: $DB.rolePermission.create(...)
      - pattern: $DB.rolePermission.createMany(...)
      - pattern: $DB.rolePermission.update(...)
      - pattern: $DB.rolePermission.updateMany(...)
      - pattern: $DB.rolePermission.upsert(...)
      - pattern: $DB.rolePermission.delete(...)
      - pattern: $DB.rolePermission.deleteMany(...)
    paths:
      exclude:
        # 매핑 편집의 유일한 통로 (ADM-3)
        - apps/api/src/admin/roles.service.ts
        - apps/api/test/
        - db/seeds/

  - id: audit-logs-mutation
    languages: [ts]
    severity: ERROR
    message: 감사 로그는 append-only 입니다 (§10.3) — UPDATE/DELETE 시도 금지.
    pattern-either:
      - pattern-regex: (UPDATE|DELETE FROM)\s+(audit\.)?audit_logs
    paths:
      exclude:
        - apps/api/test/ # 테스트 정리(cleanup)는 허용

  # WP-14: 순찰 워커가 SQL 로 권한 데이터를 직접 고치는 것을 막는다.
  # 불변식 SQL 은 **탐지 전용(SELECT)** 이며, 회수는 ResourceGrantService 를 경유해야
  # 회수 전 행 전체가 감사에 남아 복구할 수 있다(§1.3-5, L-1 요구사항).
  - id: governance-raw-permission-mutation
    languages: [ts]
    severity: ERROR
    message: >-
      raw SQL 로 권한 테이블을 변경하지 마십시오 — 회수·정리는 감사 기록을 동반하는
      ResourceGrantService / RoleGrantService 를 경유해야 합니다(§1.3-5).
    pattern-either:
      - pattern-regex: (?i)(UPDATE|DELETE\s+FROM|INSERT\s+INTO)\s+(public\.)?resource_grants
      - pattern-regex: (?i)(UPDATE|DELETE\s+FROM|INSERT\s+INTO)\s+(public\.)?role_permissions
      - pattern-regex: (?i)(UPDATE|DELETE\s+FROM|INSERT\s+INTO)\s+(public\.)?user_roles
    paths:
      exclude:
        - apps/api/test/ # 테스트 픽스처·정리는 허용
        - db/seeds/
