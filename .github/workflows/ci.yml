# CI 게이트 (작업지시서 WP-0 항목 3, RT-3 단계 가동 원칙)
# WP-0 가동: lint(G-2 포함)·typecheck·test·commitlint·perm-check
# 자리(placeholder, skip 표시): G-1(WP-8)·G-3(WP-8)·G-4(WP-1)·G-5(WP-3)
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: lint (G-2 금지 패턴 포함)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  commitlint:
    name: commitlint (perm 타입 포함 규약)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  perm-check:
    name: perm 커밋의 골든 파일 동반 검사 (§16.3-3)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: perm 커밋이 governance/matrix.yaml 변경을 동반하는지 검사
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PERM_COMMITS=$(git log --format='%H %s' "$BASE..$HEAD" | grep -E ' perm(\(|!|:)' || true)
          if [ -z "$PERM_COMMITS" ]; then
            echo "perm 커밋 없음 — 통과"
            exit 0
          fi
          echo "perm 커밋 발견:"; echo "$PERM_COMMITS"
          if git diff --name-only "$BASE..$HEAD" | grep -qx 'governance/matrix.yaml'; then
            echo "골든 파일 변경 동반 — 통과"
          else
            echo "::error::perm 커밋은 governance/matrix.yaml 변경을 동반해야 합니다 (기획서 §16.3-3)"
            exit 1
          fi

  # ── 이하 자리(placeholder) 잡 — 검사 대상·스크립트가 생기는 WP에서 가동 (RT-3) ──
  g1-matrix:
    name: 'G-1 권한 매트릭스 (자리 — WP-8 가동)'
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "placeholder"

  g3-attack:
    name: 'G-3 공격 시나리오 회귀 (자리 — WP-8 가동)'
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "placeholder"

  g4-seed:
    name: 'G-4 시드 정합성'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm g4

  g5-endpoints:
    name: 'G-5 미선언 엔드포인트 (자리 — WP-3 가동)'
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "placeholder"
