# CI 게이트 (기획서 §14.2, 작업지시서 RT-3 단계 가동 원칙)
# Phase 1 완료 시점 기준 전 게이트 가동:
#   G-1 권한 매트릭스 · G-2 금지 패턴(lint+Semgrep) · G-3 공격 시나리오 회귀
#   G-4 시드 정합성 · G-5 미선언 엔드포인트 + typecheck·test·commitlint·perm-check
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: lint (G-2 금지 패턴 포함)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Semgrep (G-2 2차 — 평가기 우회 의미 패턴)
        run: |
          pipx install semgrep
          semgrep scan --config governance/semgrep --error --quiet apps db

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate # @stonex/db 생성 클라이언트 (미커밋 산출물)
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stonex
          POSTGRES_PASSWORD: stonex
          POSTGRES_DB: stonex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stonex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://stonex:stonex@localhost:5432/stonex_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-value-at-least-32-characters
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: stonex
      STORAGE_ACCESS_KEY: stonex
      STORAGE_SECRET_KEY: stonex_dev_minio
      STORAGE_REGION: us-east-1
      # 시드는 최초 SUPER_ADMIN 을 환경 변수로만 만든다(§13.1 하드코딩 금지).
      # 격자 테스트가 db:seed 를 실행하므로 CI 에도 값이 필요하다 — 일회성 테스트 DB 전용 값이다.
      SEED_SUPER_ADMIN_EMAIL: ci-admin@stonex.local
      SEED_SUPER_ADMIN_PASSWORD: ci-only-throwaway-password-9f3a2c
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      # 통합 테스트는 실제 스키마를 요구한다 (G-1·G-3 하니스는 자체 마이그레이션을 하지 않는다)
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://stonex:stonex@localhost:5432/stonex_test
      - name: MinIO 기동 (공식 이미지는 `server /data` 인자가 필요해 services 로는 띄울 수 없다)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=stonex -e MINIO_ROOT_PASSWORD=stonex_dev_minio \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/ready || { docker logs minio; exit 1; }
      - run: pnpm test

  commitlint:
    name: commitlint (perm 타입 포함 규약)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  perm-check:
    name: perm 커밋의 골든 파일 동반 검사 (§16.3-3)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: perm 커밋이 governance/matrix.yaml 변경을 동반하는지 검사
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PERM_COMMITS=$(git log --format='%H %s' "$BASE..$HEAD" | grep -E ' perm(\(|!|:)' || true)
          if [ -z "$PERM_COMMITS" ]; then
            echo "perm 커밋 없음 — 통과"
            exit 0
          fi
          echo "perm 커밋 발견:"; echo "$PERM_COMMITS"
          if git diff --name-only "$BASE..$HEAD" | grep -qx 'governance/matrix.yaml'; then
            echo "골든 파일 변경 동반 — 통과"
          else
            echo "::error::perm 커밋은 governance/matrix.yaml 변경을 동반해야 합니다 (기획서 §16.3-3)"
            exit 1
          fi

  # ── 권한 거버넌스 게이트 (WP-8에서 전 게이트 가동) ──
  g1-matrix:
    name: 'G-1 권한 매트릭스'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stonex
          POSTGRES_PASSWORD: stonex
          POSTGRES_DB: stonex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stonex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://stonex:stonex@localhost:5432/stonex_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-value-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://stonex:stonex@localhost:5432/stonex_test
      - run: pnpm --filter @stonex/api exec jest test/g1-matrix.spec.ts

  g3-attack:
    name: 'G-3 공격 시나리오 회귀'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stonex
          POSTGRES_PASSWORD: stonex
          POSTGRES_DB: stonex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stonex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://stonex:stonex@localhost:5432/stonex_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-value-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://stonex:stonex@localhost:5432/stonex_test
      - run: pnpm --filter @stonex/api exec jest test/g3-attack-scenarios.spec.ts

  g4-seed:
    name: 'G-4 시드 정합성'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm g4

  g5-endpoints:
    name: 'G-5 미선언 엔드포인트'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm g5
